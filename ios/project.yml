name: HakoniwaDS
options:
  bundleIdPrefix: jp.hakoniwa
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HakoniwaDS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Products.storekit"
          - "HakoniwaDS.entitlements"
      - path: Web
        type: folder
        buildPhase: resources
      - path: App/Products.storekit
        buildPhase: none
    # iCloud キー値ストア（セーブの同期）。有料の Developer Program が要る。無料の Personal Team で署名できないときは、この entitlements の行を外す
    entitlements:
      path: App/HakoniwaDS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hakoniwa.ds
        PRODUCT_NAME: HakoniwaDS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 箱庭！DS
        CFBundleName: HakoniwaDS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
  HakoniwaDSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Unit
      - path: App/Products.storekit
        buildPhase: resources
    dependencies:
      - target: HakoniwaDS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hakoniwa.ds.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HakoniwaDS.app/HakoniwaDS
        BUNDLE_LOADER: $(TEST_HOST)
  HakoniwaDSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: HakoniwaDS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hakoniwa.ds.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HakoniwaDS
schemes:
  HakoniwaDS:
    build:
      targets:
        HakoniwaDS: all
        HakoniwaDSTests: [test]
        HakoniwaDSUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
      # Edit Scheme → Run → Arguments でチェックを入れて使う（既定はオフ）
      commandLineArguments:
        "-storeOffline": false
        "-resetSave": false
    test:
      config: Debug
      targets:
        - HakoniwaDSTests
        - HakoniwaDSUITests
    archive:
      config: Release
